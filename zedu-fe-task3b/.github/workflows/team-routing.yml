name: Team routing

# Routes a contributor PR to their team lead(s) for review. Runs on pull_request_target and reads
# teams.yml from the base branch only, so a PR can't change who reviews it.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - ready_for_review
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: team-routing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  AUTHOR: ${{ github.event.pull_request.user.login }}

jobs:
  route:
    name: Route to team lead
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Resolve team
        id: team
        run: |
          # Only route contributor PRs from forks; same-repo branches are reviewers'/bots' own work.
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "$REPO" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$AUTHOR" in
            *\[bot\]|github-actions)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          ruby -ryaml -e '
            cfg = YAML.load_file(".github/teams.yml") || {}
            author = ENV.fetch("AUTHOR")
            name, team = (cfg["teams"] || {}).find { |_, v| Array(v["members"]).include?(author) }
            if team
              puts "found=true"
              puts "team=#{name}"
              puts "leads=#{Array(team["leads"]).join(",")}"
              puts "reviewer=#{team["reviewer"]}"
            else
              puts "found=false"
              puts "fallback=#{cfg["fallback_reviewer"]}"
            end
          ' >> "$GITHUB_OUTPUT"

      - name: Request lead review
        if: steps.team.outputs.skip != 'true'
        env:
          FOUND: ${{ steps.team.outputs.found }}
          TEAM: ${{ steps.team.outputs.team }}
          LEADS: ${{ steps.team.outputs.leads }}
          REVIEWER: ${{ steps.team.outputs.reviewer }}
          FALLBACK: ${{ steps.team.outputs.fallback }}
        run: |
          if [ "$FOUND" = "true" ]; then
            leads=$(printf '%s' "$LEADS" | tr ',' '\n' | grep -v '^$' || true)
            if [ -z "$leads" ]; then
              gh pr comment "$PR" --body "Team routing: **$TEAM** has no leads in \`.github/teams.yml\`. Add at least one lead so this PR can be reviewed."
              exit 0
            fi
            printf '%s\n' "$leads" | while read -r handle; do
              gh pr edit "$PR" --add-reviewer "$handle" || gh pr comment "$PR" --body "Team routing: couldn't request review from @$handle (not a collaborator yet?)."
            done
            gh pr comment "$PR" --body "Team routing: **$TEAM** — requested review from the team lead(s): $(printf '@%s ' $leads). Zedu reviewer: @${REVIEWER:-unassigned}."
          elif [ -n "$FALLBACK" ]; then
            if gh pr edit "$PR" --add-reviewer "$FALLBACK"; then
              gh pr comment "$PR" --body "Team routing: @$AUTHOR isn't listed under any team in \`.github/teams.yml\`; requested @$FALLBACK instead."
            else
              gh pr comment "$PR" --body "Team routing: @$AUTHOR isn't listed under any team in \`.github/teams.yml\`, and requesting a review from @$FALLBACK failed (not a collaborator yet?)."
            fi
          else
            gh pr comment "$PR" --body "Team routing: @$AUTHOR isn't listed under any team in \`.github/teams.yml\`, and no \`fallback_reviewer\` is set. Add them to a team."
          fi
