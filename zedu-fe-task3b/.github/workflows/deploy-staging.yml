name: Deploy Zedu Frontend - staging

on:
  workflow_dispatch:
  push:
    branches:
      - staging

jobs:
  deploy_zedu_fe_staging:
    runs-on: [self-hosted, zedu-runner]

    env:
      CI: true

    if: github.event.repository.fork == false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install node_modules
        run: pnpm install --no-frozen-lockfile

      - name: Build on workflow first
        run: pnpm build

      - name: Rebuild frontend on deployment server
        run: |
          eval $(ssh-agent -s)
          trap 'ssh-agent -k' EXIT

          echo "${{ secrets.ZEDU_SERVER_SSH_KEY }}" | ssh-add -

          ssh -o StrictHostKeyChecking=no ${{ secrets.ZEDU_SERVER_SSH_USER }}@${{ secrets.ZEDU_SERVER_SSH_HOST }} << 'ENDSSH'
            set -e

            cd /var/www/zedu_fe_staging

            git reset --hard
            git pull origin staging

            export CI=true

            pnpm install --no-frozen-lockfile
            pnpm build
          ENDSSH

      - name: Pull and Restart App
        run: |
          eval $(ssh-agent -s)
          trap 'ssh-agent -k' EXIT

          echo "${{ secrets.ZEDU_SERVER_SSH_KEY }}" | ssh-add -

          ssh -o StrictHostKeyChecking=no ${{ secrets.ZEDU_SERVER_SSH_USER }}@${{ secrets.ZEDU_SERVER_SSH_HOST }} << 'ENDSSH'
            cd /var/www/zedu_fe_staging
            supervisorctl restart zedu_fe_staging
          ENDSSH
