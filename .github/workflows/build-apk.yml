name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Configure environment variables
        working-directory: mobile
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://jtkmxcfcqrwmewnujcfq.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_DHLPNkOrFRwzZmk9KT3kRQ_DFrBposE" >> .env

      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK file
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" EverydayMarket.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverydayMarket-APK
          path: EverydayMarket.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Everyday Market Mobile App (v1.0.0)"
          body: "Direct download link for the Everyday Market Android APK. Download and install on your phone."
          files: EverydayMarket.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
